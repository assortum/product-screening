name: Deploy static compliance base to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate regulatory registry
        run: python3 scripts/validate_regulatory_data.py
      - name: Validate browser JavaScript
        run: |
          node --check assets/app-core.js
          node --check assets/app-detail.js
          node --check assets/terminology.js
          node --check assets/app-ui.js
      - name: Build clothing compliance data
        run: |
          mkdir -p /tmp/screening-inputs
          mv data-src/shoes-01.json /tmp/screening-inputs/
          mv data-src/children-*.json /tmp/screening-inputs/
          mv data-src/stationery-01.json /tmp/screening-inputs/
          mv data-src/pets-01.json /tmp/screening-inputs/
          mv data-src/home-garden-01.json /tmp/screening-inputs/
          mv data-src/books-01.json /tmp/screening-inputs/
          python3 scripts/build_compliance.py
          mv /tmp/screening-inputs/* data-src/
      - name: Merge footwear compliance data
        run: python3 scripts/build_footwear.py
      - name: Merge child products compliance data 01
        run: python3 scripts/build_children.py
      - name: Merge child products compliance data 02
        run: python3 scripts/build_children_02.py
      - name: Merge stationery compliance data
        run: python3 scripts/build_stationery.py
      - name: Merge pet products compliance data
        run: python3 scripts/build_pets.py
      - name: Merge home and garden compliance data
        run: python3 scripts/build_home_garden.py
      - name: Merge books compliance data
        run: python3 scripts/build_books.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
