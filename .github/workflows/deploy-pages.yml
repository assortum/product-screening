name: Deploy static compliance base to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build clothing compliance data
        run: |
          mv data-src/shoes-01.json /tmp/shoes-01.json
          mv data-src/children-01.json /tmp/children-01.json
          python3 scripts/build_compliance.py
          mv /tmp/shoes-01.json data-src/shoes-01.json
          mv /tmp/children-01.json data-src/children-01.json
      - name: Merge footwear compliance data
        run: python3 scripts/build_footwear.py
      - name: Merge child products compliance data
        run: python3 scripts/build_children.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
